name: Update Solana Ecosystem Report

on:
  schedule:
    # Every 30 minutes. Adjust to taste — see README "Changing the schedule".
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report
        run: python main.py --once

      - name: Commit updated data + dashboard
        run: |
          git config user.name "solana-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --quiet --cached || git commit -m "chore: auto-update Solana ecosystem report [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
